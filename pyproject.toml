[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jmetalpy"
version = "1.9.0"
description = "Python version of the jMetal framework"
readme = "README.md"
authors = [
    {name = "Antonio J. Nebro", email = "ajnebro@uma.es"},
    {name = "Antonio Benítez", email = "antonio.b@uma.es"}
]

maintainers = [
    {name = "Antonio J. Nebro", email = "ajnebro@uma.es"},
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12"
]
requires-python = ">=3.11"
dependencies = [
    "tqdm",
    "numpy>=2.2.5",
    "pandas>=2.2.3",
    "plotly>=5.22.0",
    "matplotlib>=3.0.2",
    "scipy>=1.15.3",
    "statsmodels>=0.9.0",
    "mockito",
    "moocore>=0.1.8"
]

[tool.pytest.ini_options]
addopts = [
    "--import-mode=importlib",
]
markers = [
    "smoke: Quick tests for basic functionality verification (CI gating)",
    "slow: Tests that take more than 5 seconds to run",
    "integration: Tests that verify multiple components working together",
]

[project.optional-dependencies]
core = [
    "tqdm",
    "numpy>=2.2.5",
    "pandas>=2.2.3",
    "plotly>=5.22.0",
    "matplotlib>=3.0.2",
    "scipy>=1.15.3",
    "statsmodels>=0.9.0",
    "mockito",
    "moocore>=0.1.9",
]

docs = [
    "tqdm",
    "numpy>=2.2.5",
    "pandas>=2.2.3",
    "plotly>=5.22.0",
    "matplotlib>=3.0.2",
    "scipy>=1.15.3",
    "statsmodels>=0.9.0",
    "mockito",
    "jupyter",
    "nbsphinx"
]

distributed = [
    "tqdm",
    "numpy>=2.2.5",
    "pandas>=2.2.3",
    "plotly>=5.22.0",
    "matplotlib>=3.0.2",
    "scipy>=1.15.3",
    "statsmodels>=0.9.0",
    "mockito",
    "dask[complete]>=2024.3.0",
    "distributed>=2024.3.0",
    "pyspark>=3.4.0"
]

test = [
    "tqdm",
    "numpy>=2.2.5",
    "pandas>=2.2.3",
    "plotly>=5.22.0",
    "matplotlib>=3.0.2",
    "scipy>=1.15.3",
    "statsmodels>=0.9.0",
    "mockito",
    "moocore>=0.1.9",
    "pytest>=7.0",
    "pytest-cov>=4.0"
]

complete = [
    "tqdm",
    "numpy>=2.2.5",
    "pandas>=2.2.3",
    "plotly>=5.22.0",
    "matplotlib>=3.0.2",
    "scipy>=1.15.3",
    "statsmodels>=0.9.0",
    "mockito",
    "jupyter",
    "nbsphinx",
    "dask[complete]>=2024.3.0",
    "distributed>=2024.3.0",
    "pyspark>=3.4.0"
]

dev = [
    "tqdm",
    "numpy>=2.2.5",
    "pandas>=2.2.3",
    "plotly>=5.22.0",
    "matplotlib>=3.0.2",
    "scipy>=1.15.3",
    "statsmodels>=0.9.0",
    "mockito",
    "moocore>=0.1.9",
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.6.0",
    "build>=1.2.0",
    "twine>=5.0.0"
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
# Legacy codebase (6+ years): keep to mechanical, low-conflict checks.
# ANN/D are deliberately excluded — enabling them would flag type-annotation
# and docstring completeness across the whole legacy codebase as blocking
# CI failures, which is exactly the cost/benefit problem that got mypy
# dropped from this project (see CODING_GUIDELINES.md #5).
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]

# Pre-existing findings on legacy code as of the 2026-07 ruff rollout, not yet
# reviewed case by case (wildcard imports, mutable defaults, type comparisons,
# etc.). New code must not introduce these; remove codes here as each is
# cleaned up. Do not add new codes to this list going forward.
ignore = [
    "E501",   # line-too-long
    "E711",   # none-comparison
    "E712",   # true-false-comparison
    "E721",   # type-comparison
    "E731",   # lambda-assignment
    "F401",   # unused-import
    "F403",   # undefined-local-with-import-star
    "F405",   # undefined-local-with-import-star-usage
    "F841",   # unused-variable
    "B006",   # mutable-argument-default
    "B007",   # unused-loop-control-variable
    "B008",   # function-call-in-default-argument
    "B017",   # assert-raises-exception
    "B028",   # no-explicit-stacklevel
    "B904",   # raise-without-from-inside-except
    "B905",   # zip-without-explicit-strict
    "C400",   # unnecessary-generator-list
    "C403",   # unnecessary-list-comprehension-set
    "C408",   # unnecessary-collection-call
    "C416",   # unnecessary-comprehension
    "C417",   # unnecessary-map
    "SIM102", # collapsible-if
    "SIM103", # needless-bool
    "SIM105", # suppressible-exception
    "SIM108", # if-else-block-instead-of-if-exp
    "SIM110", # reimplemented-builtin
    "SIM113", # enumerate-for-loop
    "SIM118", # in-dict-keys
    "SIM201", # negate-equal-op
    "UP007",  # non-pep604-annotation-union
    "UP030",  # format-literals
    "UP031",  # printf-string-formatting
    "UP035",  # deprecated-import
    "E741",   # ambiguous-variable-name
]

[tool.ruff.lint.mccabe]
max-complexity = 10


